# ~/.config/starship.toml
#
# A minimal, clean, and informative prompt using Starship.
# Perfect for Python developers, data scientists, and general use.

# Inserts a blank line between shell prompts
add_newline = true

# Use custom symbols for the prompt character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[❮](bold green)"

# --- Right Prompt ---
# Shows the command duration and current time on the right side.
[line_break]
disabled = false

[cmd_duration]
min_time = 1000  # Only show duration for commands that take longer than 1 second
format = "took [$duration](bold yellow)"

[time]
disabled = false
time_format = "%r" # e.g., 03:40:15 PM
format = "[$time](bold)"
utc_time_offset = "local"

# --- Main Prompt Modules ---

[directory]
# Color of the directory name
style = "bold blue"

# Shows a 🔒 symbol if the directory is read-only
read_only = " 🔒"
read_only_style = "red"

# Git branch and status information
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "
conflicted = " conflicted"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = " ${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# --- Language & Environment Modules ---

# Python environment and version (conda, pyenv, virtualenv)
[python]
symbol = "🐍 "
pyenv_version_name = true
format = 'via [$symbol($version )(\($virtualenv\) )]($style)'
style = "bold yellow"

# Conda environment information
[conda]
symbol = " "
format = '[$symbol$environment](bold green) '
ignore_base = false # Set to true if you don't want to see the (base) environment

# Shows current Kubernetes context and namespace
[kubernetes]
disabled = true
format = 'on [⛵ $context($namespace)](bold cyan) '

# Shows Node.js version
[nodejs]
symbol = " "
format = "via [$symbol($version)]($style) "
style = "bold green"
disabled = true # Set to false if you work with Node.js

# Shows Rust version
[rust]
symbol = " "
format = "via [$symbol($version)]($style) "
style = "bold red"
disabled = true # Set to false if you work with Rust
